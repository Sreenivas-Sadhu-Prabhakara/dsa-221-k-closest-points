<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">SQUARED distances gives the same order — no floats, no sqrt, no precision bugs.</text>
